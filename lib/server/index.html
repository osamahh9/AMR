<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>AMR PRO OS v5.2</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a4e6ff", "background": "#131313", "primary-container": "#00d1ff",
                        "on-primary-container": "#003543", "secondary-container": "#34ff8d",
                        "on-secondary-container": "#003919", "error": "#ffb4ab", "error-container": "#93000a",
                        "surface": "#131313", "on-surface": "#e5e2e1", "surface-container": "#201f1f"
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 209, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 209, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px; min-height: 100dvh; transition: background-color 0.5s ease;
            overflow-x: hidden;
        }
        .glass-card { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(0, 209, 255, 0.2); }
        #joystick-container { width: 140px; height: 140px; background: rgba(0, 209, 255, 0.05); border: 2px solid rgba(0, 209, 255, 0.2); border-radius: 50%; position: relative; touch-action: none; margin: 0 auto; }
        #joystick-handle { width: 44px; height: 44px; background: rgba(0, 209, 255, 0.9); border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(0, 209, 255, 0.8); cursor: pointer; z-index: 10; }
        canvas { border-radius: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.05); display: block; }
        .status-normal { background-color: #131313; }
        .status-nav { background-color: #001a21; }
        .status-obs { background-color: #210002; }
        
        .meter-bar-h { width: 80px; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; position: relative; }
        .meter-fill-h { height: 100%; background: #00d1ff; width: 0%; position: absolute; left: 50%; transition: all 0.1s; box-shadow: 0 0 10px #00d1ff; }
        .center-line { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.2); z-index: 1; }

        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #a4e6ff; box-shadow: 0 0 8px rgba(0, 209, 255, 0.8); cursor: pointer; }
    </style>
</head>
<body class="text-on-surface flex flex-col pb-8 pt-[70px] status-normal">
    <header class="bg-surface/80 backdrop-blur-md text-primary fixed top-0 w-full border-b border-primary/20 shadow-lg flex justify-between items-center px-4 h-14 z-50">
        <h1 class="font-mono-data text-sm text-primary tracking-tighter uppercase">AMR_OS_v5.2_PRO</h1>
        <div class="flex items-center gap-2">
            <span class="text-[9px] font-bold text-on-surface-variant uppercase">Advanced</span>
            <input type="checkbox" id="adv_toggle" class="form-checkbox h-4 w-4 text-primary bg-surface border-primary/40 rounded cursor-pointer" onchange="toggleAdv()">
        </div>
    </header>

    <main class="flex-1 px-4 flex flex-col gap-4 max-w-lg mx-auto w-full overflow-x-hidden">
        
        <!-- DRIVE CONTROL (Ear Meters) -->
        <section class="glass-card rounded-xl p-4 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-primary/20 pb-2">
                <h2 class="font-mono-data text-[10px] text-primary tracking-widest uppercase" id="mode_title">PID Mode</h2>
                <div class="flex items-center gap-2 bg-black/40 px-2 py-1 rounded-full">
                    <span class="text-[8px] text-on-surface-variant font-bold">PID</span>
                    <input type="checkbox" id="pid_toggle" checked onchange="togglePid()" class="sr-only peer">
                    <div onclick="document.getElementById('pid_toggle').click()" class="relative w-7 h-4 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-primary cursor-pointer"></div>
                    <span class="text-[8px] text-on-surface-variant font-bold">RAW</span>
                </div>
            </div>

            <div class="flex justify-between items-center px-1 py-2">
                <!-- Left Ear -->
                <div class="flex flex-col items-center gap-1.5">
                    <span class="font-mono-data text-[10px] text-primary" id="l_val">0</span>
                    <div class="meter-bar-h"><div class="center-line"></div><div id="l_meter" class="meter-fill-h"></div></div>
                    <span class="text-[8px] text-on-surface-variant uppercase font-bold">Left</span>
                </div>
                
                <div id="joystick-container"><div id="joystick-handle"></div></div>

                <!-- Right Ear -->
                <div class="flex flex-col items-center gap-1.5">
                    <span class="font-mono-data text-[10px] text-primary" id="r_val">0</span>
                    <div class="meter-bar-h"><div class="center-line"></div><div id="r_meter" class="meter-fill-h"></div></div>
                    <span class="text-[8px] text-on-surface-variant uppercase font-bold">Right</span>
                </div>
            </div>
        </section>

        <!-- SPATIAL MAP (Fixed Responsiveness) -->
        <section class="glass-card rounded-xl p-3 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <h2 class="font-mono-data text-[10px] text-primary tracking-widest uppercase">Spatial Grid</h2>
                <button class="text-[8px] text-primary/60 border border-primary/20 px-2 rounded" onclick="resetMap()">Reset Path</button>
            </div>
            <div id="map-parent" class="w-full aspect-[2/1] relative overflow-hidden">
                <canvas id="mapCanvas" class="w-full h-full"></canvas>
            </div>
            <div class="flex justify-between font-mono-data text-[9px] text-on-surface-variant uppercase px-1">
                <span>X: <span id="cur_x">0</span></span>
                <span>Y: <span id="cur_y">0</span></span>
                <span>TH: <span id="cur_th">0</span>°</span>
            </div>
        </section>

        <!-- OSCILLOSCOPES (Autoscale) -->
        <section class="glass-card rounded-xl p-3 flex flex-col gap-3">
            <div class="flex flex-col gap-1.5">
                <span class="text-[8px] font-mono-data text-secondary-container uppercase">Wheel RPM - Autoscaling</span>
                <div id="rpm-parent" class="w-full h-[60px]"><canvas id="rpmChart" class="w-full h-full"></canvas></div>
            </div>
            <div class="flex flex-col gap-1.5">
                <span class="text-[8px] font-mono-data text-error uppercase">Range Trend (cm) - Autoscaling</span>
                <div id="dist-parent" class="w-full h-[40px]"><canvas id="distChart" class="w-full h-full"></canvas></div>
            </div>
        </section>

        <!-- ADVANCED SECTION -->
        <div id="adv_section" class="hidden flex flex-col gap-4">
            <section class="glass-card rounded-xl p-4 flex flex-col gap-4">
                <h2 class="font-mono-data text-[10px] text-secondary-container uppercase border-b border-secondary-container/20 pb-1">Servo Actuators</h2>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px]"><span class="text-on-surface-variant">SERVO 1</span><span class="text-primary font-mono-data" id="s1v">90°</span></div>
                        <input class="w-full h-1 bg-primary/10 rounded-lg appearance-none cursor-pointer" id="s1" max="180" min="0" oninput="updateServo(1)" type="range" value="90"/>
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px]"><span class="text-on-surface-variant">SERVO 2</span><span class="text-primary font-mono-data" id="s2v">90°</span></div>
                        <input class="w-full h-1 bg-primary/10 rounded-lg appearance-none cursor-pointer" id="s2" max="180" min="0" oninput="updateServo(2)" type="range" value="90"/>
                    </div>
                </div>
            </section>

            <section class="glass-card rounded-xl p-4 flex flex-col gap-4">
                <h2 class="font-mono-data text-[10px] text-primary uppercase border-b border-primary/20 pb-1">Motion Parameters</h2>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between text-[10px]">
                            <span class="text-on-surface-variant uppercase">Global Speed Mult</span>
                            <span class="text-primary font-bold" id="speed_val">1.0x</span>
                        </div>
                        <input class="w-full h-1 bg-primary/10 rounded-lg appearance-none cursor-pointer" id="speed_mult" max="2.0" min="0.1" step="0.1" type="range" value="1.0" oninput="updateSpeedDisp()"/>
                        <div class="flex justify-between text-[8px] italic text-on-surface-variant">
                            <span>Limit Power: <span id="calc_pwr">100</span>%</span>
                            <span>Limit RPM: <span id="calc_rpm">200</span></span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="flex flex-col gap-1">
                            <label class="text-[8px] text-on-surface-variant uppercase text-center">Kp</label>
                            <input type="number" step="0.01" value="0.15" class="bg-black/40 text-primary font-mono-data border border-primary/20 rounded p-1 text-[10px] text-center outline-none" onchange="tune('kp', this.value)">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[8px] text-on-surface-variant uppercase text-center">Ki</label>
                            <input type="number" step="0.01" value="0.05" class="bg-black/40 text-primary font-mono-data border border-primary/20 rounded p-1 text-[10px] text-center outline-none" onchange="tune('ki', this.value)">
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-card rounded-xl p-3 flex flex-col gap-2">
                <h2 class="font-mono-data text-[10px] text-secondary-container tracking-widest uppercase border-b border-secondary-container/10 pb-1">Quick Missions</h2>
                <div class="grid grid-cols-3 gap-2">
                    <button class="text-[9px] border border-secondary-container/30 p-2 rounded text-secondary-container uppercase" onclick="nav(300, 150, 90)">Red</button>
                    <button class="text-[9px] border border-secondary-container/30 p-2 rounded text-secondary-container uppercase" onclick="nav(300, 0, 90)">Green</button>
                    <button class="text-[9px] border border-secondary-container/30 p-2 rounded text-secondary-container uppercase" onclick="nav(300, -150, 90)">Blue</button>
                    <button class="text-[9px] border border-primary/30 p-2 rounded text-primary uppercase" onclick="nav(400, 0, 0)">Conv</button>
                    <button class="text-[9px] border border-primary/30 p-2 rounded text-primary uppercase" onclick="nav(800, 0, 180)">Arm</button>
                    <button class="text-[9px] border border-error/30 p-2 rounded text-error uppercase" onclick="nav(0, 0, 0)">Home</button>
                </div>
            </section>
        </div>

        <button class="w-full bg-error-container text-white font-bold py-4 rounded-xl active:scale-95 transition-all border border-error/40 uppercase shadow-lg text-xs" onclick="stopAll()">Emergency HALT</button>
    </main>

    <script>
        let isJoystickActive = false;
        let joystickX = 0, joystickY = 0;
        let lastSentL = 0, lastSentR = 0; 
        const container = document.getElementById('joystick-container');
        const handle = document.getElementById('joystick-handle');
        const path = [];
        const rpmHistory = { l: [], r: [] };
        const distHistory = [];
        const MAX_HISTORY = 100;

        function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
        function toggleAdv() { vibrate(20); document.getElementById('adv_section').classList.toggle('hidden', !document.getElementById('adv_toggle').checked); }
        function togglePid() { 
            vibrate(50); 
            const isPid = document.getElementById('pid_toggle').checked; 
            document.getElementById('mode_title').innerText = isPid ? "PID Mode" : "Raw Mode"; 
            fetch("/mode?pid=" + (isPid ? 1 : 0)); 
            updateMotors();
        }
        function updateSpeedDisp() { 
            const val = document.getElementById('speed_mult').value; 
            document.getElementById('speed_val').innerText = val + 'x'; 
            document.getElementById('calc_rpm').innerText = Math.round(200 * val); 
            document.getElementById('calc_pwr').innerText = Math.round(100 * val);
            vibrate(10); 
        }

        function handleJoystick(e) {
            if (!isJoystickActive) return;
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2, centerY = rect.height / 2;
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            let x = clientX - rect.left - centerX, y = clientY - rect.top - centerY;
            const distance = Math.min(Math.sqrt(x*x + y*y), 60);
            const angle = Math.atan2(y, x);
            x = Math.cos(angle) * distance; y = Math.sin(angle) * distance;
            handle.style.left = (centerX + x) + 'px'; handle.style.top = (centerY + y) + 'px';
            joystickX = x / 60; joystickY = -y / 60;
            updateMotors();
        }

        function updateMotors() {
            const isPid = document.getElementById('pid_toggle').checked;
            const mult = parseFloat(document.getElementById('speed_mult').value || 1.0);
            let l = joystickY + joystickX, r = joystickY - joystickX;
            const maxVal = Math.max(Math.abs(l), Math.abs(r));
            if (maxVal > 1.0) { l /= maxVal; r /= maxVal; }

            const threshold = isPid ? 2 : 1; 
            const currentL = isPid ? Math.round(l * 200 * mult) : Math.round(l * 100 * mult);
            const currentR = isPid ? Math.round(r * 200 * mult) : Math.round(r * 100 * mult);

            const lChanged = Math.abs(currentL - lastSentL) > threshold || (currentL === 0 && lastSentL !== 0);
            const rChanged = Math.abs(currentR - lastSentR) > threshold || (currentR === 0 && lastSentR !== 0);

            if (lChanged || rChanged) {
                lastSentL = currentL;
                lastSentR = currentR;

                if (isPid) {
                    updateVisuals(currentL, currentR, 200 * mult, " RPM");
                    fetch("/drive?left=" + currentL + "&right=" + currentR);
                } else {
                    updateVisuals(currentL, currentR, 100 * mult, "%");
                    fetch("/raw?left=" + currentL + "&right=" + currentR);
                }
            }
        }

        function updateVisuals(l, r, max, unit) {
            document.getElementById('l_val').innerText = l + (unit || "");
            document.getElementById('r_val').innerText = r + (unit || "");
            const lFill = document.getElementById('l_meter');
            const rFill = document.getElementById('r_meter');
            const lPerc = (l / (max || 1)) * 50; 
            const rPerc = (r / (max || 1)) * 50;
            if (l >= 0) { lFill.style.left = '50%'; lFill.style.width = Math.abs(lPerc) + '%'; }
            else { lFill.style.left = (50 - Math.abs(lPerc)) + '%'; lFill.style.width = Math.abs(lPerc) + '%'; }
            if (r >= 0) { rFill.style.left = '50%'; rFill.style.width = Math.abs(rPerc) + '%'; }
            else { rFill.style.left = (50 - Math.abs(rPerc)) + '%'; rFill.style.width = Math.abs(rPerc) + '%'; }
        }

        function stopAll() {
            vibrate([150, 50, 150]);
            isJoystickActive = false; handle.style.left = '50%'; handle.style.top = '50%';
            joystickX = 0; joystickY = 0; 
            // Explicitly reset meters to zero
            updateVisuals(0, 0, 1, "");
            fetch("/halt");
            document.body.style.backgroundColor = '#410004'; setTimeout(() => { document.body.style.backgroundColor = ''; }, 150);
        }

        function drawMap(rawX, rawY, rawTh) {
            const canvas = document.getElementById('mapCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const x = parseFloat(rawX) || 0;
            const y = parseFloat(rawY) || 0;
            const th = parseFloat(rawTh) || 0;
            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) { 
                canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; 
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let minX = x, maxX = x, minY = y, maxY = y;
            path.forEach(p => {
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
            });
            const deltaX = Math.max(maxX - minX, 100); const deltaY = Math.max(maxY - minY, 100);
            const pixelMargin = 32; 
            const availableWidth = canvas.width - (2 * pixelMargin);
            const availableHeight = canvas.height - (2 * pixelMargin);
            const scaleX = availableWidth / deltaX; const scaleY = availableHeight / deltaY;
            let scale = Math.min(scaleX, scaleY); if (scale > 1.2) scale = 1.2; 
            const midX = (minX + maxX) / 2; const midY = (minY + maxY) / 2;
            const offX = canvas.width / 2 - midX * scale; const offY = canvas.height / 2 + midY * scale;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 1;
            const gridSpacing = 50; 
            const startX = Math.floor((-offX) / scale / gridSpacing) * gridSpacing;
            const endX = Math.floor((canvas.width - offX) / scale / gridSpacing) * gridSpacing;
            for (let gx = startX; gx <= endX; gx += gridSpacing) {
                const sx = offX + gx * scale; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
            }
            const startY = Math.floor((offY - canvas.height) / scale / gridSpacing) * gridSpacing;
            const endY = Math.floor((offY) / scale / gridSpacing) * gridSpacing;
            for (let gy = startY; gy <= endY; gy += gridSpacing) {
                const sy = offY - gy * scale; ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(0, 209, 255, 0.15)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(offX, 0); ctx.lineTo(offX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, offY); ctx.lineTo(canvas.width, offY); ctx.stroke();
            if (path.length > 0) {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(0, 209, 255, 0.65)'; ctx.lineWidth = 2.5;
                path.forEach((p, i) => {
                    const px = offX + p.x * scale; const py = offY - p.y * scale;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.stroke();
            }
            const rx = offX + x * scale; const ry = offY - y * scale;
            const pulseRadius = 14 + Math.sin(Date.now() / 150) * 4;
            ctx.beginPath(); ctx.arc(rx, ry, pulseRadius, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(52, 255, 141, 0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.save(); ctx.translate(rx, ry); ctx.rotate(-th);
            ctx.shadowBlur = 15; ctx.shadowColor = '#34ff8d'; ctx.fillStyle = '#34ff8d'; 
            ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -8); ctx.lineTo(-5, 0); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill();
            ctx.restore();
            document.getElementById('cur_x').innerText = x.toFixed(0);
            document.getElementById('cur_y').innerText = y.toFixed(0);
            document.getElementById('cur_th').innerText = (th * 180 / Math.PI).toFixed(1);
        }

        function drawChart(id, data, colors, max) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            if (canvas.width !== canvas.offsetWidth) { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const step = canvas.width / MAX_HISTORY;
            colors.forEach((col, idx) => {
                const d = Array.isArray(data) ? data : data[idx === 0 ? 'l' : 'r'];
                ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
                d.forEach((v, i) => { const vx = i * step, vy = canvas.height - (Math.min(Math.abs(v), max) / (max || 1) * canvas.height); if(i===0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy); });
                ctx.stroke();
            });
        }

        function fetchStatus() {
            fetch("/status").then(r => r.json()).then(data => {
                document.body.className = data.obs ? "status-obs text-on-surface flex flex-col pb-8 pt-[70px]" : (data.left != 0 ? "status-nav text-on-surface flex flex-col pb-8 pt-[70px]" : "status-normal text-on-surface flex flex-col pb-8 pt-[70px]");
                if(data.obs) vibrate(40);
                const xVal = parseFloat(data.x) || 0; const yVal = parseFloat(data.y) || 0; const thVal = parseFloat(data.th) || 0;
                path.push({x: xVal, y: yVal}); if(path.length > 200) path.shift();
                drawMap(xVal, yVal, thVal);
                rpmHistory.l.push(data.left); rpmHistory.r.push(data.right); if(rpmHistory.l.length > MAX_HISTORY) { rpmHistory.l.shift(); rpmHistory.r.shift(); }
                const rpmPeak = Math.max(Math.max(...rpmHistory.l.map(Math.abs)), Math.max(...rpmHistory.r.map(Math.abs)), 50);
                drawChart('rpmChart', rpmHistory, ['#34ff8d', '#00d1ff'], rpmPeak);
                distHistory.push(data.dist); if(distHistory.length > MAX_HISTORY) distHistory.shift();
                const distPeak = Math.max(...distHistory, 20); drawChart('distChart', distHistory, ['#ffb4ab'], distPeak);
            }).catch(e => {});
        }

        function resetMap() { path.length = 0; vibrate(20); }
        function nav(x,y,th) { vibrate(20); fetch("/nav?x="+x+"&y="+y+"&th="+th); }
        function tune(p,v) { vibrate(20); fetch("/tune?param="+p+"&val="+v); }
        function updateServo(ch) { const val = document.getElementById("s" + ch).value; document.getElementById("s" + ch + "v").innerText = val + "°"; fetch("/servo?ch=" + (ch - 1) + "&angle=" + val); }

        container.addEventListener('mousedown', (e) => { isJoystickActive = true; handleJoystick(e); vibrate(10); });
        container.addEventListener('touchstart', (e) => { isJoystickActive = true; handleJoystick(e); vibrate(10); e.preventDefault(); }, {passive: false});
        window.addEventListener('mousemove', handleJoystick);
        window.addEventListener('touchmove', handleJoystick, {passive: false});
        const stopJoy = () => { if(isJoystickActive) { isJoystickActive=false; handle.style.left='50%'; handle.style.top='50%'; joystickX=0; joystickY=0; updateMotors(); } };
        window.addEventListener('mouseup', stopJoy); window.addEventListener('touchend', stopJoy); window.addEventListener('blur', stopJoy);
        setInterval(fetchStatus, 150);
    </script>
</body>
</html>
